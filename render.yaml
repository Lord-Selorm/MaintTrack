services:
  - type: web
    name: mainttrack
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health-check
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
    # NOTE: On the free tier the filesystem is ephemeral — the SQLite DB and
    # uploads are re-seeded on every cold start (admin + sample data return,
    # user-entered data resets). To persist data, upgrade to a paid plan and
    # add a disk (uncomment below and set DB_PATH=/data/maintrack.db):
    #disk:
    #  name: mainttrack-data
    #  mountPath: /data
    #  envVars:
    #    - key: DB_PATH
    #      value: /data/maintrack.db