version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: maintenance_tracker_db
    environment:
      MONGO_INITDB_DATABASE: maintenance_tracker
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - maintenance_network

  app:
    build: .
    container_name: maintenance_tracker_api
    environment:
      MONGODB_URI: mongodb://mongodb:27017/maintenance_tracker
      PORT: 5000
      JWT_SECRET: your_secret_key_here
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    networks:
      - maintenance_network
    command: npm start

volumes:
  mongodb_data:

networks:
  maintenance_network:
    driver: bridge
